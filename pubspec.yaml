name: walkpenang
description: WalkPenang mobile app
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.0
  google_sign_in: ^7.2.0
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.4.5 #FOR UPLOADING IMAGES
  image_picker: ^1.2.3 #FOR SELECTING IMAGES

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  # Module 5 business rules are pure Dart, so they are tested with the plain
  # test package rather than through a Flutter binding.
  test: ^1.24.0

  # Module 5 DAO tests run against an in-memory Firestore so no live Firebase
  # project or network access is needed in CI or on a teammate's machine.
  fake_cloud_firestore: ^4.0.0

flutter:
  uses-material-design: true
  # No assets declared on this branch yet. main's pubspec lists assets/images/,
  # and Module 5 adds assets/badges/ when the badge artwork lands in Sprint 3.
