name: walkpenang
description: WalkPenang mobile app
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1 #JOST + IBM PLEX MONO FROM THE DESIGN TOKENS
  shared_preferences: ^2.2.0
  google_sign_in: ^7.2.0
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.4.5 #FOR UPLOADING IMAGES
  image_picker: ^1.2.3 #FOR SELECTING IMAGES
  cloud_functions: ^6.3.5 # email OTP callables, used by services/otp_service.dart
  cached_network_image: ^3.4.1

  # Map & GPS module
  google_maps_flutter: ^2.18.0
  geolocator: ^13.0.1
  url_launcher: ^6.3.1
  http: ^1.2.2
  flutter_dotenv: ^5.2.1 # loads MAPS_API_KEY from .env for Places/Directions calls

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  # Module 5 business rules are pure Dart, so they are tested with the plain
  # test package rather than through a Flutter binding.
  test: ^1.24.0

  # Module 5 DAO tests run against an in-memory Firestore so no live Firebase
  # project or network access is needed in CI or on a teammate's machine.
  fake_cloud_firestore: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
  # Module 5 adds assets/badges/ here when the badge artwork lands in Sprint 3.
  # Until then reward_constants.dart's badge asset paths are metadata only —
  # BadgeEmblem paints its artwork programmatically and loads no SVG.

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
